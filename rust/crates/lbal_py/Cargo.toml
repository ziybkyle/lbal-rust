[package]
name = "lbal_py"
version = "0.1.0"
edition = "2021"
authors = ["群友镜中人"]
license = "MIT"
description = "PyO3 bindings for the Luck be a Landlord Rust simulator"

[lib]
name = "lbal_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
lbal_core = { path = "../lbal_core" }
pyo3 = { version = "0.30", features = ["extension-module"] }
serde_json = "1"
rayon = "1"
